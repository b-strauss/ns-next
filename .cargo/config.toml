# The repository's own tasks: `cargo xtask gates <group>` runs a group of
# CLAUDE.md's table "The gates" (`xtask/src/main.rs`).
[alias]
xtask = "run --quiet --package xtask --"

# Link the C runtime statically on Windows, so `target/release/ns-next.exe` is a single
# file that runs on a bare Windows installation. Without this it imports
# VCRUNTIME140.dll from the VC++ redistributable, which is present on almost every
# machine but not guaranteed on a fresh one. Costs roughly 100 KB of binary size.
#
# Scoped per target: a Linux or macOS build is unaffected.

# Every x86_64 target is built for x86-64-v2 (SSE4.2, POPCNT; `roundsd` is SSE4.1):
# the JIT's Float templates emit it without a choice, and `ns-next` and
# `ns-next-analyzer` check the processor first in `main`
# (`docs/design/execution.md`, "Floats in machine code").

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "target-cpu=x86-64-v2"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
