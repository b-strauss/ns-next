# The default profile is the per-commit gate: what every change can break.
# The rest of the suite runs in profiles of its own, each when the code it
# guards changes and once at the end of a batch that touched the runtime
# (`CLAUDE.md`, "Working in this repository"):
#
#     cargo nextest run --workspace --profile benchmarks-verify
#
# The benchmark programs (`benchmarks/micro/` and every Are We Fast Yet
# benchmark, `ns-cli`'s `run_benchmarks`) held to their recorded outcomes,
# the hints' behaviour oracle over them, and a timed run of each Are We Fast
# Yet benchmark, its score's shape checked; and the Java counterparts under
# `benchmarks/are-we-fast-yet/java/`, compiled with the JDK's `javac`, and the
# Python counterparts under `benchmarks/are-we-fast-yet/python/`, held to the
# same record, so this profile needs a JDK (`JAVA_HOME` or `PATH`) and a
# `python` on `PATH`.
# It verifies the benchmarks; it measures nothing. The full-size benchmarks
# take seconds to a minute each in a debug build and much longer under the
# stress modes, so they run on demand, when benchmarking, and once at the end
# of a branch, in a plain run without a stress mode.
#
#     cargo nextest run -p ns-cli --profile images
#
# Every golden through `build` then `load` (`ns-cli`'s `golden_round_trips`),
# under both lowerings, against what `run` answers: the image format's
# round trip. It doubles the goldens' cost, so it runs for a commit that
# touches the image format or the instruction encoding, and at the end of a
# batch.
#
#     cargo nextest run -p ns-cli --profile caches
#
# Every golden with the global cache cut to one two-entry group
# (`run_goldens`' `golden_with_a_two_entry_global_cache::`), so that every
# insert contends: for a commit that touches the inline or global caches,
# and at the end of a batch.
#
#     cargo nextest run -p ns-analyzer --profile hints
#
# The hints' behaviour oracle (`ns-analyzer`'s `hinted_goldens`) checks that
# applying every hint keeps every golden's outcome; it runs every golden
# twice more, so it runs for every commit that touches `crates/ns-analyzer`,
# its runs of the benchmarks left to the benchmarks-verify profile.

[profile.default]
# Eighteen of this machine's 24 cores, so that a run leaves the rest to the
# rest of the machine; every other profile inherits it.
test-threads = 18
default-filter = "not (binary(run_benchmarks) | binary(hinted_goldens) | binary(golden_round_trips) | test(/^golden_with_a_two_entry_global_cache::/))"

[profile.benchmarks-verify]
default-filter = "binary(run_benchmarks) | (binary(hinted_goldens) and test(/^hinted::[a-z]+::benchmarks\\//))"

[profile.images]
default-filter = "binary(golden_round_trips)"

[profile.caches]
default-filter = "test(/^golden_with_a_two_entry_global_cache::/)"

[profile.hints]
default-filter = "binary(hinted_goldens) and not test(/^hinted::[a-z]+::benchmarks\\//)"

# The suite under a stress mode or without the JIT (`cargo xtask gates
# stress`, which runs sixteen of them at once, so the gate's time is the
# work of all of them, plus the tail of the slowest tests where a mode makes
# a few of them run for minutes; `docs/OPEN-WORK.md`, "The stress gate's
# time"). It leaves out the crates no stress mode reaches -- the switches
# are read only by `ns-runtime`, which these crates do not run -- and
# starts the tests that ended alone in a measured run (2026-11-13) first,
# so that they overlap the rest. `cargo xtask gates stress` also leaves
# `ns-cli`'s `debug_metadata`, which runs no program, to the WIDE run, the
# one mode that changes what it compiles.
[profile.stress]
default-filter = "not (binary(run_benchmarks) | binary(hinted_goldens) | binary(golden_round_trips) | test(/^golden_with_a_two_entry_global_cache::/)) and not (package(ns-syntax) | package(ns-memory) | package(ns-assembler) | package(xtask))"

[[profile.stress.overrides]]
filter = '''
(binary(run_goldens) and test(/^golden::reference::runtime\//))
| test(a_key_refused_for_good_does_not_starve_another_key)
| test(a_long_chain_of_futures_)
| test(a_pass_that_overruns_the_reserve_ends_the_run_with_the_passed_error)
| test(the_depth_limit_)
| test(a_deep_recursion_through_native_block_activations_runs_on_the_activation_stack)
| test(a_counting_loop_runs_in_machine_code)
| test(a_sawtooth_of_recursions_does_not_thrash)
| test(a_caller_whose_callees_keep_requesting_optimization_is_not_abandoned)
'''
priority = 100
