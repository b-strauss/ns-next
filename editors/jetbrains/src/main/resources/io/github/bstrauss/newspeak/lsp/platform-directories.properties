# The directory under the plugin's bin/ that holds the language server for a
# platform: `<system>-<architecture>`, each part looked up below. The one
# mapping both sides use: ServerBinaryLocator finds the server for the machine
# the IDE runs on through it, and build.gradle.kts places the server it builds
# under the directory it names for the building host, refusing a host it does
# not name.
#
# system.<what os.name starts with> = <system>
system.Windows = windows
system.Mac = macos
system.Linux = linux
# architecture.<os.arch, lower case> = <architecture>
architecture.amd64 = x64
architecture.x86_64 = x64
architecture.aarch64 = arm64
architecture.arm64 = arm64
