# Corpus modules that are expected to run end to end, with what running
# them produces. `ns-next run-corpus corpus/modules` runs every entry under
# both engines, fails if the two disagree byte for byte, and fails if
# either differs from what is recorded here.
#
# Format:
#   [[entry]]
#   file = "SomeModule.ns"
#   send = "theEntrySelector"    # sent with [platform, nil], as `run` does
#   expected_status = 0
#   expected_stdout = ""
#   reason = "why this module is expected to run"
#
# `send` is per entry: none of the corpus modules that run today declares
# `main:args:`. They are library modules, and their reachable entry point is
# either a public method or the implicit accessor of a public nested class.
#
# `expected_stdout` is empty for every entry below, and that is a fact about
# the corpus rather than a shortcut: no module that currently runs writes to
# `platform transcript` at all. The field is exercised by the synthetic
# fixtures in `crates/ns-cli/tests/cli.rs`, so it cannot rot unnoticed.
#
# This list grows one deliberate row at a time. A module belongs here only
# once someone has run it and recorded the result.

[[entry]]
file = "TestActor.ns"
send = "return42"
expected_status = 0
expected_stdout = ""
reason = "Instantiates with a zero-argument factory and answers a public unary method that evaluates a literal return. Needs nothing from the platform."

[[entry]]
file = "MirrorTestingModel.ns"
send = "Klass"
expected_status = 0
expected_stdout = ""
reason = "Exercises Milestone 3's nesting directly: `Klass` is the implicit accessor of a public nested class whose superclass clause is a sibling nested class, and whose body carries class sides, lazy slots, and further nested classes at every access level."

[[entry]]
file = "TextModule.ns"
send = "TextProperties"
expected_status = 0
expected_stdout = ""
reason = "A `usingPlatform:` module whose nested classes form a real inheritance chain (`TextBlock`/`TextString` on `Text properties:`); `TextProperties` is a public nested class accessor."

[[entry]]
file = "Ducts.ns"
send = "Duct"
expected_status = 0
expected_stdout = ""
reason = "A `usingPlatform:` module that binds `platform collections List` in its module state, then answers the public nested class `Duct`. This entry is why `platform collections List` exists."

[[entry]]
file = "NewspeakASTs.ns"
send = "AST"
expected_status = 0
expected_stdout = ""
reason = "The largest module that runs, and the row that stresses loading rather than evaluation: ~70 nested class declarations over a shared `AST new` superclass are parsed, resolved and built into the mixin tree, and `platform collections List` is bound in module state. Exactly one of those declarations is then evaluated -- `AST`, whose accessor this row sends."

[[entry]]
file = "V5BytecodeSimulation.ns"
send = "InstructionStream"
expected_status = 0
expected_stdout = ""
reason = "Nested classes chained two deep on `InstructionStream new`, plus `platform collections List` in module state."
