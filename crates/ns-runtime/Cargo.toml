[package]
name = "ns-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ns-assembler = { path = "../ns-assembler" }
ns-memory = { path = "../ns-memory" }
ns-syntax = { path = "../ns-syntax" }

[dev-dependencies]
# The spend of a body's budget is held to the two instructions on x64's
# hot path it was designed as, read back by the disassembler
# `ns-assembler`'s encodings are held to.
iced-x86.workspace = true
indoc.workspace = true
libtest-mimic.workspace = true

# One trial per image and part of its lengths (`libtest-mimic`): as one
# test, the loads of every truncation ran alone at the end of the suite.
[[test]]
name = "image_truncations"
harness = false

[lints]
workspace = true
