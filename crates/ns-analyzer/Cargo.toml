[package]
name = "ns-analyzer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tooling that looks at Newspeak without running it (language server, token dump, parse, disassembly, image inspection, formatting), on ns-next's front end, resolver and compiler"

# A binary of its own, so that the LSP transport and JSON never reach the
# `ns-next` binary: the editor pays for them, the runtime does not.
[[bin]]
name = "ns-next-analyzer"
path = "src/main.rs"

[dependencies]
ns-syntax = { path = "../ns-syntax" }
ns-runtime = { path = "../ns-runtime" }
ns-tooling = { path = "../ns-tooling" }
clap.workspace = true
# The LSP protocol is large and still growing; writing its types and
# transport by hand would be code with nothing to do with Newspeak, unlike
# the image format, where owning every byte is the point.
lsp-server = "0.10"
lsp-types = "0.97"
# Already in the build as `lsp-types`' URI type, named here only so that a
# URI's host can be told apart (a registered name, IPv4, an IP literal) when
# it becomes a UNC path; keep it on the version `lsp-types` uses.
fluent-uri = "0.1.4"
serde_json = "1"

[dev-dependencies]
indoc.workspace = true
insta.workspace = true
libtest-mimic.workspace = true
serde = { version = "1", features = ["derive"] }
toml.workspace = true

# One test per golden whose source the hints change (`libtest-mimic`): the
# goldens are discovered by walking `goldens/`, which libtest's own harness,
# fixing its tests at compile time, cannot do.
[[test]]
name = "hinted_goldens"
harness = false

[lints]
workspace = true
