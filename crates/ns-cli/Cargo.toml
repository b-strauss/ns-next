[package]
name = "ns-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ns-next"
path = "src/main.rs"

[dependencies]
ns-syntax = { path = "../ns-syntax" }
ns-runtime = { path = "../ns-runtime" }
ns-tooling = { path = "../ns-tooling" }
clap.workspace = true
toml.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
indoc.workspace = true
libtest-mimic.workspace = true
serde = { version = "1", features = ["derive"] }
toml.workspace = true

# One test per golden (`libtest-mimic`): libtest's own harness fixes its tests
# at compile time, and goldens are discovered by walking `goldens/`.
[[test]]
name = "run_goldens"
harness = false

[[test]]
name = "golden_round_trips"
harness = false

# One trial per part of the corruption sweep (`libtest-mimic`): as one test,
# its processes ran one after another at the end of the suite.
[[test]]
name = "image_corruptions"
harness = false

[lints]
workspace = true
