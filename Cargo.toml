[workspace]
resolver = "3"
members = ["crates/ns-syntax", "crates/ns-runtime", "crates/ns-cli", "crates/ns-tooling", "crates/ns-analyzer", "crates/ns-memory", "crates/ns-assembler", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
insta = "1"
toml = "0.8"
# Tests only: a Newspeak module written inline in a test reads as the source it
# is, indented with the Rust around it, instead of one line of `\n` escapes.
# `indoc!` strips the indentation at compile time, so the string the test sees is
# unchanged and a `const` can still hold one.
indoc = "2"
# Tests only: the golden runner makes one test per golden, which libtest's
# own harness cannot -- its tests are fixed at compile time -- so
# `crates/ns-cli/tests/run_goldens.rs` is a `harness = false` binary built on
# this, and the suite names each golden, reports every failure rather than
# the first, and filters by name. It reuses `clap`, already a dependency.
libtest-mimic = "0.8"
# The global allocator of the two binaries, `ns-next` and `ns-next-analyzer`
# (`docs/design/memory.md`, "The allocator of the Rust side"). Rust's default
# on Windows is the process heap, and the front end allocates and frees a
# node at a time: `parse-corpus` took 164 ms there against 77 ms under
# mimalloc, a boot from source 14.9 ms against 11.8 ms. snmalloc and
# rpmalloc measured the same as mimalloc, the most used of the three. It
# keeps about 1.2 MB more resident per process. C (C++ under MSVC), built
# by `cc`, so the build needs the C compiler a Rust toolchain on these
# targets already relies on.
mimalloc = { version = "0.1", default-features = false }
# The decoders of machine code: ns-assembler's encodings and the JIT's
# listings are checked against them in tests, and `ns-next run --print-code`
# decodes with the one of the target it runs on
# (`docs/design/developer-tool.md`, decision 4). The x64 decoder and its
# Intel formatter, the encoder and the other formatters left out.
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "intel", "std"] }
# The AArch64 decoder and its text, its serde support left out; `yaxpeax-arch`
# is named for the `Decoder` trait and the byte reader.
yaxpeax-arm = { version = "0.5", default-features = false, features = ["std", "fmt"] }
yaxpeax-arch = { version = "0.3", default-features = false, features = ["std"] }

# Link-time optimization across crate boundaries, and a single codegen unit so the
# optimizer sees the whole picture. Both usually help runtime speed as well as size --
# the binary is `ns-cli`, whose commands call into `ns-runtime` and `ns-syntax`, two
# separate crates, so cross-crate inlining is exactly the case LTO exists for; the
# single codegen unit does the same within each crate. Release builds get slower;
# debug builds are unaffected.
#
# `opt-level = "z"` and `panic = "abort"` shrink the binary further and are deliberately
# not set: the first trades away this project's first-order concern, and the second
# changes behaviour on panic (no unwinding, no `Drop`) and breaks `cargo test --release`.
# Debug builds at `opt-level = 1`: the suite is dominated by the interpreter
# running Newspeak, which unoptimized code runs several times slower -- the
# suite under nextest measured 16 s against 47 s, a stress mode 141 s against
# 219 s. Nothing a debug build checks is lost: `debug_assertions`, overflow
# checks and with them every stress mode stay on, and debug information stays.
[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1

# The suite without debug assertions, which is what the release-only tests
# (the size tests, `cfg(not(debug_assertions))`) need, built without the
# release profile's fat LTO and single codegen unit, whose final pass runs on
# one core and dominates the build. Never measure with it: performance is
# judged on `release` (the `measuring-performance` skill).
[profile.release-checks]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true

# `Value`, `ObjectReference` and `FrameReference` are `Copy`, so an iterator
# chain ending in `.cloned()` reads as a deep copy of what is really a register
# move. This lint is in `clippy::pedantic` and off by default; enabling it here
# is what keeps the distinction enforced by `cargo clippy --workspace --all-targets`
# rather than by a note somewhere reminding whoever looks next to re-derive the
# list.
# `ObjectReference`, `ClassReference`, `FrameReference` and
# `ActivationReference` are `Copy` indices; a reference to one is an indirection
# that buys nothing. Sized by `clippy.toml`.
# `undocumented_unsafe_blocks` keeps every `unsafe` block carrying a `// SAFETY:`
# comment that names the invariant the block relies on.
# `allow_attributes_without_reason` keeps every lint exception stating what it
# prevents or why the lint is wrong there.
# `cast_possible_truncation` and `cast_sign_loss` keep every narrowing cast stating
# the bound that makes it exact (a checked conversion, a helper beside the
# bound's owner, or a named deliberate truncation); a test's literals are exempt.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
cloned_instead_of_copied = "warn"
trivially_copy_pass_by_ref = "warn"
min_ident_chars = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
