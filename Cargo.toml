[workspace]
resolver = "2"
members = ["crates/ns-syntax", "crates/ns-runtime", "crates/ns-cli", "crates/ns-tooling", "crates/ns-analyzer", "crates/ns-memory"]

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
insta = "1"
toml = "0.8"
# Tests only: a Newspeak module written inline in a test reads as the source it
# is, indented with the Rust around it, instead of one line of `\n` escapes.
# `indoc!` strips the indentation at compile time, so the string the test sees is
# unchanged and a `const` can still hold one.
indoc = "2"
# Tests only: the golden runner makes one test per golden, which libtest's
# own harness cannot -- its tests are fixed at compile time -- so
# `crates/ns-cli/tests/run_goldens.rs` is a `harness = false` binary built on
# this, and the suite names each golden, reports every failure rather than
# the first, and filters by name. It reuses `clap`, already a dependency.
libtest-mimic = "0.8"

# Link-time optimization across crate boundaries, and a single codegen unit so the
# optimizer sees the whole picture. Both usually help runtime speed as well as size --
# the binary is `ns-cli`, whose commands call into `ns-runtime` and `ns-syntax`, two
# separate crates, so cross-crate inlining is exactly the case LTO exists for; the
# single codegen unit does the same within each crate. Release builds get slower;
# debug builds are unaffected.
#
# `opt-level = "z"` and `panic = "abort"` shrink the binary further and are deliberately
# not set: the first trades away this project's first-order concern, and the second
# changes behaviour on panic (no unwinding, no `Drop`) and breaks `cargo test --release`.
# Debug builds at `opt-level = 1`: the suite is dominated by the interpreter
# running Newspeak, which unoptimized code runs several times slower -- the
# suite under nextest measured 16 s against 47 s, a stress mode 141 s against
# 219 s. Nothing a debug build checks is lost: `debug_assertions`, overflow
# checks and with them every stress mode stay on, and debug information stays.
[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1

# `Value`, `ObjectReference` and `FrameReference` are `Copy`, so an iterator
# chain ending in `.cloned()` reads as a deep copy of what is really a register
# move. This lint is in `clippy::pedantic` and off by default; enabling it here
# is what keeps the distinction enforced by `cargo clippy --workspace --all-targets`
# rather than by a note somewhere reminding whoever looks next to re-derive the
# list.
# `ObjectReference`, `ClassReference`, `FrameReference` and
# `ActivationReference` are `Copy` indices; a reference to one is an indirection
# that buys nothing. Sized by `clippy.toml`.
[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
trivially_copy_pass_by_ref = "warn"
min_ident_chars = "warn"
